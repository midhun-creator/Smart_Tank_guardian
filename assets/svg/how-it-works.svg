text-anchor="start" letter-spacing="0" font-family="'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">GPIO 25 · tone()</text><path d="M832 340 h10 l14 -12 v44 l-14 -12 h-10 z" fill="#c9d8ee"/><path class="pu" style="animation-delay:0.0s;animation-duration:1.2s" d="M868 338 A12 12 0 0 1 868 362" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/><path class="pu" style="animation-delay:0.28s;animation-duration:1.2s" d="M868 328 A22 22 0 0 1 868 372" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/><path class="pu" style="animation-delay:0.56s;animation-duration:1.2s" d="M868 318 A32 32 0 0 1 868 382" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/><text x="906" y="360" font-size="12.5" font-weight="600" fill="#fbbf24" text-anchor="start" letter-spacing="0">900 Hz chirp = warning</text><text x="906" y="380" font-size="12.5" font-weight="600" fill="#f87171" text-anchor="start" letter-spacing="0">1600 Hz chirp = danger</text><text x="550" y="432" font-size="12.5" font-weight="500" fill="#8aa4c4" text-anchor="middle" letter-spacing="0">One cooperative loop: sensors every 500 ms, screen every 100 ms, button debounced in software, alarms on millis() timers.</text></svg>