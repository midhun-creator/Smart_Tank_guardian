<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title>How Smart Tank Guardian works</title><desc>Animated data-flow diagram: HC-SR04 and MQ-2 sensors feed the ESP32, which drives the OLED, LED and buzzer.</desc><style>
@keyframes pulse{0%{opacity:0}18%{opacity:1}60%{opacity:0}100%{opacity:0}}
.pu{animation:pulse 1.8s linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.95}100%{transform:translate(var(--dx),-44px);opacity:0}}
.gas{animation:rise 3.2s ease-in infinite;opacity:0}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:6 6;animation:flow .9s linear infinite}
@keyframes ledb{0%,50%{opacity:1}50.1%,100%{opacity:.12}}
.ledb{animation:ledb .7s linear infinite}
@keyframes lvl{0%,100%{transform:translateY(8px)}50%{transform:translateY(-4px)}}
.lvl{animation:lvl 4s ease-in-out infinite}
@keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:cursor 1s steps(1) infinite}
@keyframes chip{0%,100%{opacity:.55}50%{opacity:1}}
.chip{animation:chip 2.4s ease-in-out infinite}

@keyframes w1{0.000%{opacity:1}24.960%{opacity:1}25.000%{opacity:0}100.000%{opacity:0}}.w1{opacity:0;animation:w1 6s linear infinite}
@keyframes w2{0.000%{opacity:0}24.960%{opacity:0}25.000%{opacity:1}49.960%{opacity:1}50.000%{opacity:0}100.000%{opacity:0}}.w2{opacity:0;animation:w2 6s linear infinite}
@keyframes w3{0.000%{opacity:0}49.960%{opacity:0}50.000%{opacity:1}74.960%{opacity:1}75.000%{opacity:0}100.000%{opacity:0}}.w3{opacity:0;animation:w3 6s linear infinite}
@keyframes w4{0.000%{opacity:0}74.960%{opacity:0}75.000%{opacity:1}100.000%{opacity:1}}.w4{opacity:0;animation:w4 6s linear infinite}</style><defs><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
