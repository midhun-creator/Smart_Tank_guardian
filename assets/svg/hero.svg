<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title>Smart Tank Guardian</title><desc>Animated banner: sonar rings around a shield with a water drop, rising bubbles and moving waves.</desc><style>@keyframes wv0{from{transform:translateX(0)}to{transform:translateX(-640px)}}.wv0{animation:wv0 14s linear infinite}
