@keyframes sonar{0%{r:46;opacity:.65;stroke-width:3}100%{r:190;opacity:0;stroke-width:.5}}.sonar{animation:sonar 4.5s ease-out infinite;fill:none;stroke:#22d3ee}
@keyframes breathe{0%,100%{transform:translateY(7px)}50%{transform:translateY(-7px)}}.breathe{animation:breathe 3.6s ease-in-out infinite}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-64px)}}.drift{animation:drift 2.2s linear infinite}@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}.glow{animation:glow 3.6s ease-in-out infinite}@keyframes sweep{0%{transform:translateX(-520px)}60%,100%{transform:translateX(900px)}}.sweep{animation:sweep 6s ease-in-out infinite}@keyframes tick{0%,92%{opacity:1}96%{opacity:.15}100%{opacity:1}}.tick{animation:tick 1.2s steps(1) infinite}</style><defs>
